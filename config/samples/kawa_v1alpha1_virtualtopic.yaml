apiVersion: kawa-platform.github.io/v1alpha1
kind: VirtualTopic
metadata:
  name: orders-eu
spec:
  # The name clients use; defaults to metadata.name.
  virtualTopic: orders.eu
  physicalTopic: orders-v2
  filter:
    type: headerEquals
    header: region
    value: eu
---
apiVersion: kawa-platform.github.io/v1alpha1
kind: VirtualTopic
metadata:
  name: orders-public
spec:
  physicalTopic: orders-v2
  # Values are stored as Avro (the gateway's cluster needs a schemaRegistry) ...
  valueFormat:
    type: avro
  # ... and served as JSON, without the internal field and with order_id renamed to id.
  transformations:
    - type: dropFields
      fields: [internal_risk_score]
    - type: renameField
      from: order_id
      to: id
    - type: convert
      format:
        type: json
    # The stored records name Avro in content-type; served records name JSON.
    - type: setHeader
      header: content-type
      value: application/json
