apiVersion: v1
kind: Secret
metadata:
  name: alice-password
stringData:
  password: change-me
---
apiVersion: kawa-platform.github.io/v1alpha1
kind: Client
metadata:
  labels:
    app.kubernetes.io/name: kawa-operator
    app.kubernetes.io/managed-by: kustomize
  name: alice
spec:
  mechanism: SCRAM-SHA-512
  passwordSecretRef:
    name: alice-password
    key: password
