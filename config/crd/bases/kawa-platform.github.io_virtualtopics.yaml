---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: virtualtopics.kawa-platform.github.io
spec:
  group: kawa-platform.github.io
  names:
    kind: VirtualTopic
    listKind: VirtualTopicList
    plural: virtualtopics
    shortNames:
    - vt
    singular: virtualtopic
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.virtualTopic
      name: Topic
      type: string
    - jsonPath: .spec.physicalTopic
      name: Physical
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VirtualTopic is a virtual topic on a kawa gateway: a name clients use that the gateway maps to
          a physical topic, optionally with a consume filter.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VirtualTopicSpec is the desired virtual topic on the operator's
              gateway.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  deletionPolicy: Delete removes the virtual topic from the gateway when the VirtualTopic is
                  deleted (the default), Retain leaves it. The physical topic is never deleted.
                enum:
                - Delete
                - Retain
                type: string
              exposePhysicalTopic:
                description: |-
                  exposePhysicalTopic keeps the physical topic listed next to its virtual name in Metadata
                  responses instead of hiding it.
                type: boolean
              filter:
                description: |-
                  filter is a server-side consume filter: records that do not match are dropped at the
                  gateway during Fetch.
                properties:
                  expression:
                    description: expression is the CEL expression of a cel filter;
                      it must evaluate to a boolean.
                    minLength: 1
                    type: string
                  header:
                    description: header is the record header a header filter compares.
                    minLength: 1
                    type: string
                  type:
                    description: type of the filter.
                    enum:
                    - headerEquals
                    - headerContains
                    - headerStartsWith
                    - headerMatches
                    - cel
                    type: string
                  value:
                    description: |-
                      value is what a header filter compares the header with: equal to, contained in, a prefix
                      of, or (headerMatches) a regular expression the whole header value must match.
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: cel filters need expression only; header filters need header
                    and value only
                  rule: 'self.type == ''cel'' ? has(self.expression) && !has(self.header)
                    && !has(self.value) : has(self.header) && has(self.value) && !has(self.expression)'
              physicalTopic:
                description: physicalTopic is the topic on the Kafka cluster that
                  backs the virtual topic.
                maxLength: 249
                minLength: 1
                pattern: ^[a-zA-Z0-9._-]+$
                type: string
              transformations:
                description: |-
                  transformations are the steps the gateway applies in order to each record on fetch, after
                  the filter. Value steps rewrite the value; header steps (dropHeaders, setHeader) rewrite the
                  headers of the records the topic delivers, so format headers match the delivered
                  value. Keys are never changed. Only header steps may follow a convert step. The gateway validates the steps (paths, CEL expressions, output formats) and a
                  refusal is reported as InvalidSpec.
                items:
                  description: |-
                    Transformation is one transformation step. Fields are addressed by dotted paths
                    (customer.name); a list on a path applies the step to every element.
                  properties:
                    expression:
                      description: |-
                        expression is the CEL expression of a cel step, with the key, value, headers and timestamp
                        bindings; its result replaces the value.
                      minLength: 1
                      type: string
                    field:
                      description: field is the dotted path a defaultField step sets;
                        missing parent objects are created.
                      minLength: 1
                      type: string
                    fields:
                      description: fields are the dotted paths a dropFields step removes;
                        a path the value does not have is ignored.
                      items:
                        minLength: 1
                        type: string
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                    format:
                      description: format is what a convert step encodes the value
                        as.
                      properties:
                        onDecodeError:
                          default: skip
                          description: |-
                            onDecodeError: skip drops the record (the default), include delivers it as stored (unfiltered,
                            untransformed), fail fails the fetch.
                          enum:
                          - skip
                          - include
                          - fail
                          type: string
                        root:
                          description: |-
                            root is the root element name of xml values. Required when transformed values are encoded in
                            this format, as for subject; when set, decoding refuses another root.
                          minLength: 1
                          type: string
                        subject:
                          description: |-
                            subject is the schema registry subject of the schema avro values are encoded with. Required
                            when transformed values are encoded in this format: it is the convert format, or valueFormat
                            with a value transformation and no convert. Header-only transformations encode nothing.
                          minLength: 1
                          type: string
                        type:
                          description: |-
                            type: json, avro in the schema registry wire format (the schema registry is configured
                            on the gateway's cluster), or xml.
                          enum:
                          - json
                          - avro
                          - xml
                          type: string
                        version:
                          description: version is the subject version avro values
                            are encoded with; omitted means the latest.
                          format: int32
                          minimum: 1
                          type: integer
                      required:
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: subject and version are allowed only for avro
                        rule: self.type == 'avro' || !has(self.subject) && !has(self.version)
                      - message: version requires subject
                        rule: '!has(self.version) || has(self.subject)'
                      - message: root is allowed only for xml
                        rule: self.type == 'xml' || !has(self.root)
                    from:
                      description: from is the dotted path of the field a renameField
                        step moves.
                      minLength: 1
                      type: string
                    header:
                      description: |-
                        header is the name of the header a setHeader step sets, matched exactly (case-sensitive);
                        every header with this name is replaced.
                      minLength: 1
                      type: string
                    headers:
                      description: headers are the names of the headers a dropHeaders
                        step removes, matched exactly (case-sensitive).
                      items:
                        minLength: 1
                        type: string
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                    to:
                      description: to is the dotted path a renameField step moves
                        the field to.
                      minLength: 1
                      type: string
                    type:
                      description: |-
                        type of the step: dropFields removes fields, renameField moves a field, defaultField sets a
                        field when it is absent or null, cel replaces the value with the result of a CEL expression,
                        convert encodes the result in another format, dropHeaders removes headers, setHeader sets a header.
                      enum:
                      - dropFields
                      - renameField
                      - defaultField
                      - cel
                      - convert
                      - dropHeaders
                      - setHeader
                      type: string
                    value:
                      description: |-
                        value is the default of a defaultField step, any JSON value; omitted (or null, which the API
                        server drops) means null. For a setHeader step it is the header value, a string. Only for
                        defaultField and setHeader: the gateway refuses it on other steps, which is reported as
                        InvalidSpec, since CEL cannot check a schemaless field at admission.
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: fields is required for dropFields and allowed only there
                    rule: 'self.type == ''dropFields'' ? has(self.fields) : !has(self.fields)'
                  - message: from and to are required for renameField and allowed
                      only there
                    rule: 'self.type == ''renameField'' ? has(self.from) && has(self.to)
                      : !has(self.from) && !has(self.to)'
                  - message: field is required for defaultField and allowed only there
                    rule: 'self.type == ''defaultField'' ? has(self.field) : !has(self.field)'
                  - message: expression is required for cel and allowed only there
                    rule: 'self.type == ''cel'' ? has(self.expression) : !has(self.expression)'
                  - message: format is required for convert and allowed only there
                    rule: 'self.type == ''convert'' ? has(self.format) : !has(self.format)'
                  - message: headers is required for dropHeaders and allowed only
                      there
                    rule: 'self.type == ''dropHeaders'' ? has(self.headers) : !has(self.headers)'
                  - message: header is required for setHeader and allowed only there
                    rule: 'self.type == ''setHeader'' ? has(self.header) : !has(self.header)'
                type: array
                x-kubernetes-list-type: atomic
              valueFormat:
                description: |-
                  valueFormat is the encoding of record values, so content-based (cel) filters and
                  transformations see the decoded value instead of the raw string. Required with value steps and convert; header steps alone do not need it.
                properties:
                  onDecodeError:
                    default: skip
                    description: |-
                      onDecodeError: skip drops the record (the default), include delivers it as stored (unfiltered,
                      untransformed), fail fails the fetch.
                    enum:
                    - skip
                    - include
                    - fail
                    type: string
                  root:
                    description: |-
                      root is the root element name of xml values. Required when transformed values are encoded in
                      this format, as for subject; when set, decoding refuses another root.
                    minLength: 1
                    type: string
                  subject:
                    description: |-
                      subject is the schema registry subject of the schema avro values are encoded with. Required
                      when transformed values are encoded in this format: it is the convert format, or valueFormat
                      with a value transformation and no convert. Header-only transformations encode nothing.
                    minLength: 1
                    type: string
                  type:
                    description: |-
                      type: json, avro in the schema registry wire format (the schema registry is configured
                      on the gateway's cluster), or xml.
                    enum:
                    - json
                    - avro
                    - xml
                    type: string
                  version:
                    description: version is the subject version avro values are encoded
                      with; omitted means the latest.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: subject and version are allowed only for avro
                  rule: self.type == 'avro' || !has(self.subject) && !has(self.version)
                - message: version requires subject
                  rule: '!has(self.version) || has(self.subject)'
                - message: root is allowed only for xml
                  rule: self.type == 'xml' || !has(self.root)
              virtualTopic:
                description: |-
                  virtualTopic is the virtual topic name clients use. Defaults to the VirtualTopic's
                  metadata.name; set it for a name Kubernetes does not allow, such as one with upper case
                  letters or underscores. Immutable.
                maxLength: 249
                minLength: 1
                pattern: ^[a-zA-Z0-9._-]+$
                type: string
            required:
            - physicalTopic
            type: object
            x-kubernetes-validations:
            - message: virtualTopic is immutable
              rule: has(self.virtualTopic) == has(oldSelf.virtualTopic) && (!has(self.virtualTopic)
                || self.virtualTopic == oldSelf.virtualTopic)
          status:
            description: VirtualTopicStatus is the observed state of a VirtualTopic.
            properties:
              conditions:
                description: 'conditions: Ready is True when the gateway serves the
                  virtual topic as specified.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the generation the conditions were
                  computed for.
                format: int64
                type: integer
              virtualTopic:
                description: |-
                  virtualTopic is the virtual topic name the operator manages on the gateway. It is recorded
                  before the operator writes the topic, so it can be set while the topic is still missing on the
                  gateway after a failed write. The operator only deletes a topic it manages.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
