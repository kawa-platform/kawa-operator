---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: roles.kawa.kawa-platform.github.io
spec:
  group: kawa.kawa-platform.github.io
  names:
    kind: Role
    listKind: RoleList
    plural: roles
    singular: role
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.role
      name: Role
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Role is an RBAC role on a kawa gateway, named after the Role: ACLs that gateway groups grant
          to their clients.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RoleSpec is the desired RBAC role on the operator's gateway.
            properties:
              acls:
                description: acls of the role, as the gateway stores them.
                items:
                  description: ACL allows or denies one operation on one resource.
                  properties:
                    operation:
                      description: operation the ACL allows or denies on resource.
                      enum:
                      - READ
                      - WRITE
                      - CREATE
                      - DELETE
                      - ALTER
                      - DESCRIBE
                      - ALTER_CONFIGS
                      - DESCRIBE_CONFIGS
                      - ALL
                      type: string
                    permission:
                      description: 'permission: ALLOW grants the operation, DENY refuses
                        it. A matching DENY wins over any ALLOW.'
                      enum:
                      - ALLOW
                      - DENY
                      type: string
                    resource:
                      description: resource the ACL applies to.
                      properties:
                        pattern:
                          description: pattern is the resource name, or with patternType
                            PREFIXED its prefix.
                          type: string
                        patternType:
                          default: LITERAL
                          description: |-
                            patternType: LITERAL matches the name exactly (the default), PREFIXED every name that starts
                            with pattern.
                          enum:
                          - LITERAL
                          - PREFIXED
                          type: string
                        type:
                          description: type of the resource.
                          enum:
                          - TOPIC
                          - GROUP
                          - TRANSACTIONAL_ID
                          - CLUSTER
                          type: string
                      required:
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: pattern must be unset for CLUSTER and set for every
                          other type
                        rule: 'self.type == ''CLUSTER'' ? !has(self.pattern) : has(self.pattern)'
                      - message: an empty pattern needs patternType PREFIXED
                        rule: '!has(self.pattern) || size(self.pattern) > 0 || self.patternType
                          == ''PREFIXED'''
                  required:
                  - operation
                  - permission
                  - resource
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              deletionPolicy:
                default: Delete
                description: |-
                  deletionPolicy: Delete removes the role from the gateway when the Role is deleted (the
                  default), which also removes it from the gateway groups that list it. Retain leaves it.
                enum:
                - Delete
                - Retain
                type: string
            required:
            - acls
            type: object
          status:
            description: RoleStatus is the observed state of a Role.
            properties:
              conditions:
                description: 'conditions: Ready is True when the gateway has the role
                  as specified.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the generation the conditions were
                  computed for.
                format: int64
                type: integer
              role:
                description: |-
                  role is the role name the operator manages on the gateway. It is recorded before the operator
                  writes the role, so it can be set while the role is still missing on the gateway after a failed
                  write. The operator only deletes a role it manages.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
