apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kawa-operator.fullname" . }}
  labels:
    {{- include "kawa-operator.labels" . | nindent 4 }}
# The rules controller-gen generates from the operator's kubebuilder markers (make manifests).
rules:
  {{- (.Files.Get "files/manager-role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kawa-operator.fullname" . }}
  labels:
    {{- include "kawa-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kawa-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kawa-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kawa-operator.fullname" . }}-leader-election
  labels:
    {{- include "kawa-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kawa-operator.fullname" . }}-leader-election
  labels:
    {{- include "kawa-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kawa-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "kawa-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
