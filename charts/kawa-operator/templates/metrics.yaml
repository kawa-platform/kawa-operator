{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kawa-operator.fullname" . }}-metrics
  labels:
    {{- include "kawa-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kawa-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 8443
      targetPort: metrics
      protocol: TCP
---
# The metrics endpoint checks each scraper's token and permission with the API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kawa-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "kawa-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kawa-operator.fullname" . }}-metrics-auth
  labels:
    {{- include "kawa-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kawa-operator.fullname" . }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "kawa-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Bind this to the scraper's ServiceAccount (e.g. Prometheus) to let it read /metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kawa-operator.fullname" . }}-metrics-reader
  labels:
    {{- include "kawa-operator.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: [/metrics]
    verbs: [get]
{{- end }}
