# Release: push a tag like v0.1.0 (or v0.1.0-rc.1 for a pre-release) that points at a commit on main.
# Verifies the build, publishes ghcr.io/kawa-platform/kawa-operator:<version> for amd64 + arm64, the Helm
# chart oci://ghcr.io/kawa-platform/charts/kawa-operator:<version> (which installs that image), and creates a
# GitHub Release with generated notes.

name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semantic version (expected vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

  image:
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  chart:
    needs: [ verify, image ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v4

      - name: Package and push the chart
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm lint charts/kawa-operator --values charts/kawa-operator/ci/default-values.yaml
          helm package charts/kawa-operator --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/kawa-operator-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts"

  github-release:
    needs: [ verify, image, chart ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          body: |
            ## Install

            ```bash
            helm install kawa-operator oci://ghcr.io/kawa-platform/charts/kawa-operator \
              --version ${{ needs.verify.outputs.version }} -n kawa -f operator-values.yaml
            ```

            ## Docker image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.verify.outputs.version }}
            ```

            Multi-arch: `linux/amd64`, `linux/arm64`.
